<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset: tiny breaks that learn what works for you</title>
<style>
:root{--bg:#f3f1f8;--card:#fff;--ink:#1e1b2e;--mut:#6b6783;--acc:#5b4bdb;--accT:#fff;--sun:#ff9e5e;--line:#e1ddef;--chip:#ebe8f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111c;--card:#1c1a2b;--ink:#f1eefc;--mut:#a29fbd;--acc:#8d80ff;--accT:#12111c;--sun:#ff9e5e;--line:#2c2942;--chip:#262339}}
:root[data-theme="dark"]{--bg:#12111c;--card:#1c1a2b;--ink:#f1eefc;--mut:#a29fbd;--acc:#8d80ff;--accT:#12111c;--sun:#ff9e5e;--line:#2c2942;--chip:#262339}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded",Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sun),var(--acc))}
nav{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:99px}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);font-weight:700}
h1{font-size:34px;line-height:1.1;letter-spacing:-1px;margin:0 0 8px;font-weight:800}
h2{font-size:16px;margin:26px 0 10px;font-weight:700}
p.sub{color:var(--mut);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--chip);color:var(--ink);font:inherit;padding:10px 16px;border-radius:14px;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--acc);background:var(--card);font-weight:700}
.moods{display:flex;gap:8px}
.mood{flex:1;font-size:26px;padding:10px 0;border-radius:14px;border:2px solid transparent;background:var(--chip);cursor:pointer}
.mood.on{border-color:var(--acc);background:var(--card);transform:translateY(-3px)}
.btn{display:block;width:100%;margin-top:28px;border:0;border-radius:16px;background:var(--acc);color:var(--accT);font:inherit;font-weight:800;font-size:17px;padding:16px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--ink);margin-top:10px;font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}
.card.big h1{font-size:30px}
.meta{color:var(--mut);font-size:14px}
.why{margin:12px 0 0;padding:12px 14px;background:var(--chip);border-radius:12px;font-size:14px}
.alt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:16px;padding:14px 16px;margin-top:8px;cursor:pointer}
.stage{text-align:center;padding-top:6px}
.orbwrap{height:290px;display:grid;place-items:center}
.orb{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--sun),var(--acc) 72%);transform:scale(.6);box-shadow:0 20px 60px -10px var(--acc);display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;transition-property:transform;transition-timing-function:ease-in-out}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width 1s linear}
.cue{font-size:26px;font-weight:800;letter-spacing:-.5px;min-height:70px;line-height:1.2}
.row{display:flex;gap:10px}.row .btn{margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;letter-spacing:-1px}
.stat span{color:var(--mut);font-size:13px}
.lift{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.lift .n{width:120px;flex:none}
.lift .tr{flex:1;height:10px;background:var(--chip);border-radius:9px;position:relative;overflow:hidden}
.lift .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:9px}
.lift .v{width:44px;text-align:right;font-weight:700}
.week{display:flex;gap:8px}
.wd{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.wd i{display:block;height:34px;border-radius:10px;background:var(--chip);margin-bottom:4px}
.wd.has i{background:linear-gradient(160deg,var(--sun),var(--acc))}
.done{font-size:64px;text-align:center;margin:14px 0 0}
.fine{margin-top:34px;color:var(--mut);font-size:12px;text-align:center}
.link{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:18px}
@media(prefers-reduced-motion:reduce){.orb,.bar i{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="dot"></span>Reset</div>
<nav><button id="n1" class="on">Check in</button><button id="n2">Your lift</button></nav></header>
<main id="m"></main>
<p class="fine">Reset offers general relaxation and movement breaks, not medical advice. Stop any exercise that hurts.</p>
</div>
<script>
const $=s=>document.querySelector(s),M=$('#m');
let S={log:[]};try{S=JSON.parse(localStorage.getItem('reset_v1'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('reset_v1',JSON.stringify(S))}catch(e){}};
const FACES=['😣','😕','😐','🙂','😄'];
const B=(n,p)=>({breath:p,name:n});
const R=[
{id:'box',name:'Box breathing',e:'🟦',k:'breath',p:[['Breathe in',4,1],['Hold',4,1],['Breathe out',4,.6],['Hold',4,.6]],mind:['racing','foggy'],body:['tense','fine'],why:'Even counts steady a racing mind.'},
{id:'exhale',name:'Long exhale',e:'🌬️',k:'breath',p:[['Breathe in',4,1],['Breathe out slowly',6,.6]],mind:['racing','flat'],body:['tense','drained'],why:'Breathing out longer than in tells your body it can slow down.'},
{id:'desk',name:'Desk release',e:'🧘',k:'steps',s:[['Sit tall and drop your shoulders away from your ears',15],['Tilt your head to the right, ear toward shoulder',20],['Now tilt to the left',20],['Roll both shoulders back, slowly',20],['Circle your wrists, then spread your fingers wide',20],['Clasp hands behind you and open your chest',20],['Take one big breath in and let it fall out',10]],mind:['racing','foggy'],body:['tense'],why:'Neck, shoulders and wrists hold the most screen-time tension.'},
{id:'ground',name:'5-4-3-2-1 grounding',e:'🌱',k:'steps',s:[['Name 5 things you can see',30],['Name 4 things you can touch',25],['Name 3 things you can hear',25],['Name 2 things you can smell',20],['Name 1 thing you can taste, then breathe out',20]],mind:['racing','flat'],body:['fine','tense','drained'],why:'Counting senses pulls attention out of your head and into the room.'},
{id:'eyes',name:'Eye rest',e:'👀',k:'steps',s:[['Look away from the screen. Find something far away',20],['Keep looking far. Let your eyes soften',20],['Blink slowly 10 times',15],['Rub your palms warm and rest them over closed eyes',30],['Open your eyes and look at something green or natural',15]],mind:['foggy'],body:['fine','tense'],why:'Long focus on a near screen tires eye muscles. Distance resets them.'},
{id:'walk',name:'Water and walk',e:'💧',k:'steps',s:[['Stand up and fill a glass of water',40],['Drink half of it, slowly',20],['Walk anywhere for two minutes. Pass a window if you can',120],['Come back and roll your shoulders once',10]],mind:['foggy','flat'],body:['drained','fine'],why:'Movement plus water is the cheapest energy boost there is.'},
{id:'shake',name:'Shake it out',e:'⚡',k:'steps',s:[['Stand up. Shake out your hands and arms',20],['Shake your legs, one at a time',20],['March in place, knees up',30],['Reach both arms overhead and stretch tall',15],['Three quick breaths in through the nose, out through the mouth',15]],mind:['flat','foggy'],body:['drained'],why:'Short bursts of movement wake the body up when you feel heavy.'},
{id:'note',name:'One good thing',e:'📝',k:'steps',s:[['Close your eyes and breathe slowly',20],['Recall one thing that went well today, however small',30],['Picture it in detail: where were you, who was there?',30],['Say thank you to yourself or someone else, silently',20]],mind:['flat','racing'],body:['fine','drained'],why:'Revisiting a small win lifts a flat mood without forcing positivity.'}
];
const st={mind:null,body:null,time:2,before:3},V={tab:'home'};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function totalSec(r,t){return r.k==='breath'?t*60:r.s.reduce((a,x)=>a+x[1],0)}
function stats(){const by={};S.log.forEach(l=>{(by[l.id]=by[l.id]||[]).push(l.after-l.before)});return by}
function streak(){const days=new Set(S.log.map(l=>dkey(l.t)));let n=0,d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function recs(){const by=stats();const sc=R.map(r=>{let s=(r.mind.includes(st.mind)?(r.mind[0]===st.mind?3:2):0)+(r.body.includes(st.body)?(r.body[0]===st.body?3:2):0);
if(r.k==='steps'&&totalSec(r,st.time)>st.time*60+40)s-=4;if(r.k==='steps'&&totalSec(r,st.time)<st.time*60*.4)s-=1;
const a=by[r.id];if(a&&a.length){const avg=a.reduce((x,y)=>x+y,0)/a.length;s+=Math.max(-2,Math.min(3,avg*1.5))}return{r,s}});
return sc.sort((a,b)=>b.s-a.s).map(x=>x.r)}
function nav(t){V.tab=t;$('#n1').className=t==='you'?'':'on';$('#n2').className=t==='you'?'on':'';t==='you'?you():home()}
$('#n1').onclick=()=>{stop();nav('home')};$('#n2').onclick=()=>{stop();nav('you')};
const chips=(k,opts)=>'<div class="chips">'+opts.map(o=>`<button class="chip ${st[k]===o[0]?'on':''}" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')+'</div>';
function bind(f){M.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;st[b.dataset.k]=isNaN(v)?v:+v;f()})}
function home(){
M.innerHTML=`<h1>Take two minutes.<br>Reset your day.</h1><p class="sub">Tell us how you're arriving. Get one short exercise that fits, and see over time which ones actually help you.</p>
<h2>Your mind feels</h2>${chips('mind',[['racing','Racing'],['foggy','Foggy'],['flat','Flat'],['clear','Pretty clear']])}
<h2>Your body feels</h2>${chips('body',[['tense','Tense'],['drained','Drained'],['fine','Fine']])}
<h2>Time you have</h2>${chips('time',[[2,'2 min'],[5,'5 min'],[10,'10 min']])}
<h2>Mood right now</h2><div class="moods">${FACES.map((f,i)=>`<button class="mood ${st.before===i+1?'on':''}" data-k="before" data-v="${i+1}" aria-label="Mood ${i+1} of 5">${f}</button>`).join('')}</div>
<button class="btn" id="go" ${st.mind&&st.body?'':'disabled'}>Find my reset</button>`;
bind(home);const g=$('#go');if(g)g.onclick=pick}
function pick(){const L=recs(),r=L[0],by=stats()[r.id];
const mins=Math.max(1,Math.round(totalSec(r,st.time)/60));
M.innerHTML=`<p class="sub">Your reset</p><div class="card big"><div style="font-size:42px">${r.e}</div><h1>${r.name}</h1><div class="meta">About ${mins} min</div>
<div class="why">${r.why}${by?` You've gained ${(by.reduce((a,b)=>a+b,0)/by.length).toFixed(1)} mood points on average with this one.`:''}</div></div>
<button class="btn" id="start">Start ${r.name.toLowerCase()}</button>
<h2>Or try</h2>${L.slice(1,3).map(x=>`<button class="alt" data-id="${x.id}"><span>${x.e} ${x.name}</span><span class="meta">${Math.max(1,Math.round(totalSec(x,st.time)/60))} min</span></button>`).join('')}
<button class="btn ghost" id="back">Change answers</button>`;
$('#start').onclick=()=>run(r);$('#back').onclick=home;M.querySelectorAll('.alt').forEach(b=>b.onclick=()=>run(R.find(x=>x.id===b.dataset.id)))}
let T=null,seq,i,left,paused,tot,doneS,cur;
function stop(){clearInterval(T);T=null}
function build(r){if(r.k==='steps')return r.s.map(x=>({t:x[0],d:x[1],sc:null}));
const cyc=r.p.reduce((a,x)=>a+x[1],0),n=Math.max(3,Math.round(st.time*60/cyc)),o=[{t:'Sit comfortably. Let your shoulders drop.',d:6,sc:.6}];
for(let c=0;c<n;c++)r.p.forEach(x=>o.push({t:x[0],d:x[1],sc:x[2]}));return o}
function run(r){cur=r;seq=build(r);i=0;paused=false;tot=seq.reduce((a,x)=>a+x.d,0);doneS=0;left=seq[0].d;
M.innerHTML=`<div class="stage"><div class="bar"><i id="pb"></i></div><div class="orbwrap"><div class="orb" id="orb"><span id="cnt"></span></div></div><div class="cue" id="cue"></div><div class="meta" id="of"></div>
<div class="row"><button class="btn ghost" id="pz">Pause</button><button class="btn ghost" id="sk">Skip step</button></div><button class="link" id="end">End early</button></div>`;
show();$('#pz').onclick=()=>{paused=!paused;$('#pz').textContent=paused?'Resume':'Pause'};
$('#sk').onclick=()=>{doneS+=left;next()};$('#end').onclick=()=>{stop();rate(doneS>=10?doneS:0)};
stop();T=setInterval(()=>{if(paused)return;left--;doneS++;$('#pb').style.width=Math.min(100,doneS/tot*100)+'%';if(left<=0)next();else $('#cnt').textContent=left},1000)}
function show(){const x=seq[i],o=$('#orb');$('#cue').textContent=x.t;$('#cnt').textContent=x.d;$('#of').textContent=cur.k==='steps'?`Step ${i+1} of ${seq.length}`:'Follow the circle';
if(x.sc){o.style.transitionDuration=x.d+'s';o.style.transform=`scale(${x.sc})`}else{o.style.transitionDuration='.6s';o.style.transform='scale(.8)'}}
function next(){i++;if(i>=seq.length){stop();return rate(tot)}left=seq[i].d;show()}
function rate(sec){if(!sec){return home()}
M.innerHTML=`<div class="done">🌿</div><h1 style="text-align:center">Nicely done.</h1><p class="sub" style="text-align:center">How do you feel now?</p>
<div class="moods" style="margin-top:18px">${FACES.map((f,k)=>`<button class="mood" data-a="${k+1}" aria-label="Mood ${k+1} of 5">${f}</button>`).join('')}</div>`;
M.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=+b.dataset.a;S.log.push({t:Date.now(),id:cur.id,before:st.before,after:a,sec:sec});save();fin(a)})}
function fin(a){const d=a-st.before,s=streak();
M.innerHTML=`<div class="done">${d>0?'📈':d===0?'🌤️':'🫶'}</div><h1 style="text-align:center">${d>0?`Up ${d} mood point${d>1?'s':''}`:d===0?'Steady, and that counts':'Some days a break is all it is'}</h1>
<p class="sub" style="text-align:center">${s>1?`${s} days in a row. `:'First reset logged. '}We'll use this to suggest what works best for you.</p>
<button class="btn" id="a">Back to check in</button><button class="btn ghost" id="b">See your lift</button>`;
$('#a').onclick=()=>nav('home');$('#b').onclick=()=>nav('you')}
function you(){const by=stats(),L=S.log,mins=Math.round(L.reduce((a,l)=>a+l.sec,0)/60);
const rows=R.filter(r=>by[r.id]).map(r=>({r,v:by[r.id].reduce((a,b)=>a+b,0)/by[r.id].length,n:by[r.id].length})).sort((a,b)=>b.v-a.v);
const wk=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return{l:'SMTWTFS'[d.getDay()],h:L.some(x=>dkey(x.t)===dkey(d))}});
M.innerHTML=`<h1>Your lift</h1><p class="sub">Average mood change, before to after each reset.</p>
<div class="stats" style="margin-top:16px"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${L.length}</b><span>resets</span></div><div class="stat"><b>${mins}</b><span>minutes</span></div></div>
<h2>This week</h2><div class="week">${wk.map(w=>`<div class="wd ${w.h?'has':''}"><i></i>${w.l}</div>`).join('')}</div>
<h2>What works for you</h2>${rows.length?rows.map(x=>`<div class="lift"><span class="n">${x.r.e} ${x.r.name}</span><span class="tr"><i style="width:${Math.max(4,Math.min(100,(x.v+1)/5*100))}%"></i></span><span class="v">${x.v>0?'+':''}${x.v.toFixed(1)}</span></div>`).join('')+`<p class="meta">${rows[0].v>0?`${rows[0].r.name} helps you most so far. We'll suggest it more often.`:'Keep going. A few more resets and the pattern will show.'}</p>`:`<div class="card"><p class="sub">Nothing yet. Do your first reset and your results show up here.</p><button class="btn" id="s" style="margin-top:6px">Start a reset</button></div>`}
${L.length?'<button class="link" id="clr">Clear my data</button>':''}`;
const s=$('#s');if(s)s.onclick=()=>nav('home');const c=$('#clr');if(c)c.onclick=()=>{if(confirm('Delete all your reset history on this device?')){S={log:[]};save();you()}}}
home();
</script>
</body>
</html>
